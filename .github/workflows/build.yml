name: Build Driver

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Extract Source Code
      run: |
        unzip driver.zip
        ls -R

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu make zip

    - name: Build
      run: |
        make KPM_SDK=.
        
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: compiled-driver
        path: |
          **/*.ko
          **/*.kpm
